# Native Node.js deployment (no Docker, no Redis).
# Apply as a Blueprint after copying the existing PostgreSQL connection string
# into DATABASE_URL. It must point to the existing crowdpulse-db.
services:
  - type: web
    name: crowdpulse-native
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm install --prefix backend --omit=dev
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: SESSION_ID
        value: demo-session
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPERATOR_USERNAME
        value: operator
      - key: OPERATOR_PASSWORD
        sync: false
      - key: SENSOR_USERNAME
        value: sensor
      - key: SENSOR_PASSWORD
        sync: false
      - key: ATTENDEE_USERNAME
        value: attendee
      - key: ATTENDEE_PASSWORD
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SENSOR_INTERVAL_SECONDS
        value: 2
      - key: AI_SERVICE_URL
        value: https://crowdpulse-ai-native.onrender.com
