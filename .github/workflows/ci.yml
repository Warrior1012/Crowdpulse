name: CrowdPulse CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Verify generated dashboard
        run: test -s backend/public/index.html

  backend:
    name: Backend syntax and pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install --omit=dev
        working-directory: backend
      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/db.js
          node --check backend/ai-engine.js
          node --check backend/simulator.js
          node --check backend/cctv-pipeline.js
      - name: Run CCTV pipeline unit tests
        run: node backend/cctv-pipeline.test.js

  ai-service:
    name: Python AI service and model smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install AI and smoke-test dependencies
        run: pip install -r ai-service/requirements.txt httpx==0.28.1
      - name: Check Python syntax
        run: python -m py_compile ai-service/app.py ai-service/test_app.py
      - name: Smoke-test AI endpoints and trained model
        run: python ai-service/test_app.py
